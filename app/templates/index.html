<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Document Agent</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px;
            text-align: center;

            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        .upload-box {
            padding: 35px;
            border: 2px dashed #555;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin: 20px 0;
            color: white;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;

            background: white;
            color: black;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .supported {
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🤖 AI Document Agent</h1>

        <p class="subtitle">
            Upload a document and talk to your document with AI.
        </p>

        <div class="upload-box">

            <h3>📄 Upload your document</h3>

            <input
                type="file"
                id="document"
                accept=".pdf,.doc,.docx"
            >

            <br>

            <button onclick="uploadDocument()">
                Upload Document
            </button>

        </div>

        <p class="supported">
            Supported formats: PDF, DOC, DOCX
        </p>

    </div>

    <script>
        function uploadDocument() {
            const file = document.getElementById("document").files[0];

            if (!file) {
                alert("Please select a document first.");
                return;
            }

            alert("Document selected: " + file.name);
        }
    </script>

</body>
</html>
